services:
  - type: web
    name: brodar-ai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free # Deploys on Render's Free tier
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        description: "Your Telegram Bot API Token from @BotFather"
      - key: ZAI_API_KEY
        sync: false
        description: "Your Zhipu AI (Z.ai) API Key (for GLM models)"
      - key: GEMINI_API_KEY
        sync: false
        description: "Google AI Studio API key (for Gemini vision models)"
      - key: MODEL_NAME
        value: glm-4.7-flash
        description: "Default model key: glm-4.7-flash | gemini-3.5-flash-lite | gemini-3.1-flash-lite"
      - key: DATABASE_URL
        sync: false
        description: "Neon Postgres Connection String"
      - key: WEBHOOK_URL
        sync: false
        description: "The base URL where this app is deployed (e.g., https://brodar-ai-bot.onrender.com). Do not include trailing slash."
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
        description: "A secure random token for Telegram Webhook payload validation"
      - key: ALLOWED_DM_USER_IDS
        sync: false
        description: "Comma-separated Telegram user IDs allowed to DM the bot"
