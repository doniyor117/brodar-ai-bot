services:
  - type: web
    name: telegram-ai-agent-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free # Deploys on Render's Free tier
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        description: "Your Telegram Bot API Token from @BotFather"
      - key: ZAI_API_KEY
        sync: false
        description: "Your Zhipu AI (Z.ai) API Key"
      - key: MODEL_NAME
        value: glm-4.7-flash
        description: "Model to use for completion (default: glm-4.7-flash)"
      - key: DATABASE_URL
        sync: false
        description: "Neon Postgres Connection String"
      - key: WEBHOOK_URL
        sync: false
        description: "The base URL where this app is deployed (e.g., https://telegram-ai-agent-bot.onrender.com). Do not include trailing slash."
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true
        description: "A secure random token for Telegram Webhook payload validation (automatically generated by Render)"
